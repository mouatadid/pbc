name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Lint with Ruff
        run: uvx ruff check .

  check-packaging:
    name: Package Build & Import Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install package in editable mode
        run: |
          uv venv
          uv pip install -e .
      - name: Verify package imports without PYTHONPATH
        run: |
          uv run python -c "import models; import utils; import data; print('All core modules imported successfully')"
